<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ادمین | پروگ آرت</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/lalezar-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">پروگ آرت</a>
            <ul class="nav-links">
                <li><a href="index.html">خانه</a></li>
                <li><a href="chat.html">چت روم</a></li>
                <li><a href="admin.html">پنل ادمین</a></li>
            </ul>
            <button class="theme-toggle" id="theme-toggle" aria-label="تغییر تم">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                </svg>
            </button>
        </nav>
    </header>

    <section class="auth-section" id="login-view">
        <div class="auth-box">
            <h2>ورود ادمین</h2>
            <p class="auth-sub">فقط مدیر سایت می‌تواند وارد شود</p>

            <form id="login-form">
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="login-btn">ورود</button>
                <p class="form-error" id="login-error"></p>
            </form>
        </div>
    </section>

    <section class="admin-section" id="admin-view" style="display: none;">
        
        <div class="admin-header">
            <h2>پنل ادمین</h2>
            <button class="btn-ghost" id="logout-btn">خروج</button>
        </div>

        <div class="editor-box">
            <h3 id="editor-title">مقاله جدید</h3>

            <form id="article-form">
                <input type="hidden" id="edit-id" value="">

                <div class="form-group">
                    <label>عنوان</label>
                    <input type="text" id="title" required placeholder="عنوان مقاله...">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>دسته‌بندی</label>
                        <input type="text" id="tag" placeholder="مثلاً: برنامه‌نویسی" value="عمومی">
                    </div>

                    <div class="form-group">
                        <label>حذف خودکار بعد از</label>
                        <select id="expires">
                            <option value="7">۷ روز</option>
                            <option value="30" selected>۳۰ روز</option>
                            <option value="90">۹۰ روز</option>
                            <option value="365">۱ سال</option>
                            <option value="0">هیچ‌وقت</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>عکس کاور (اختیاری)</label>
                    <div class="image-upload" id="image-upload-box">
                        <input type="file" id="image-input" accept="image/*" hidden>
                        
                        <div id="image-preview-wrap" style="display: none;">
                            <img id="image-preview" alt="پیش‌نمایش">
                            <button type="button" class="btn-remove-image" id="remove-image">حذف عکس</button>
                        </div>
                        
                        <div id="image-placeholder" class="upload-placeholder">
                            <span>📷</span>
                            <p>برای انتخاب عکس کلیک کن</p>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>متن مقاله</label>
                    <textarea id="content" required rows="12" placeholder="متن مقاله‌ات را اینجا بنویس..."></textarea>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn-primary" id="publish-btn">🚀 انتشار مقاله</button>
                    <button type="button" class="btn-ghost" id="cancel-edit-btn" style="display: none;">لغو ویرایش</button>
                </div>

                <p class="form-success" id="publish-success"></p>
                <p class="form-error" id="publish-error"></p>
            </form>
        </div>

        <div class="editor-box">
            <h3>مقاله‌های منتشرشده</h3>
            <div id="admin-articles-list">
                <p class="loading">در حال بارگذاری...</p>
            </div>
        </div>

    </section>

    <footer>
        <p>© ۱۴۰۴ پروگ آرت</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script src="admin.js"></script>

</body>
</html>
